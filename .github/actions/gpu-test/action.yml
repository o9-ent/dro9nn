name: "GPU Test Runner"
description: "Runs GPU-accelerated tests with proper CUDA configuration"

inputs:
  test-path:
    description: "Path to test directory"
    required: true
  python-version:
    description: "Python version"
    required: false
    default: "3.11"
  timeout:
    description: "Test timeout in minutes"
    required: false
    default: "30"
  gpu-memory-fraction:
    description: "Fraction of GPU memory to use (0.0-1.0)"
    required: false
    default: "0.9"

outputs:
  test-result:
    description: "Test result (passed/failed)"
    value: ${{ steps.run-tests.outputs.result }}
  gpu-info:
    description: "GPU information"
    value: ${{ steps.check-gpu.outputs.info }}

runs:
  using: "composite"
  steps:
    - name: Check GPU availability
      id: check-gpu
      shell: bash
      run: |
        if command -v nvidia-smi &> /dev/null; then
          nvidia-smi
          GPU_INFO=$(nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader)
          echo "info=$GPU_INFO" >> $GITHUB_OUTPUT
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "No GPU available"
          echo "available=false" >> $GITHUB_OUTPUT
          echo "info=none" >> $GITHUB_OUTPUT
        fi

    - name: Configure CUDA
      if: steps.check-gpu.outputs.available == 'true'
      shell: bash
      run: |
        # Set memory fraction to prevent OOM
        export CUDA_VISIBLE_DEVICES=0
        export TF_FORCE_GPU_ALLOW_GROWTH=true
        export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512

        # Log GPU memory
        python -c "import torch; print(f'CUDA available: {torch.cuda.is_available()}')" || true
        python -c "import torch; print(f'CUDA device: {torch.cuda.get_device_name(0) if torch.cuda.is_available() else \"N/A\"}')" || true

    - name: Run GPU tests
      id: run-tests
      shell: bash
      run: |
        cd ${{ inputs.test-path }}

        # Set up environment
        export CUDA_VISIBLE_DEVICES=0
        export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512

        # Run tests with timeout
        timeout ${{ inputs.timeout }}m pytest tests/ \
          -v \
          --tb=short \
          -m "gpu" \
          --cov=. \
          --cov-report=xml \
          --junitxml=gpu-test-results.xml \
          2>&1 || TEST_EXIT_CODE=$?

        if [ "${TEST_EXIT_CODE:-0}" -eq 0 ]; then
          echo "result=passed" >> $GITHUB_OUTPUT
        else
          echo "result=failed" >> $GITHUB_OUTPUT
          exit $TEST_EXIT_CODE
        fi

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gpu-test-results
        path: |
          ${{ inputs.test-path }}/gpu-test-results.xml
          ${{ inputs.test-path }}/coverage.xml
        retention-days: 7

    - name: Cleanup GPU memory
      if: always()
      shell: bash
      run: |
        # Clear GPU memory cache
        python -c "import torch; torch.cuda.empty_cache()" 2>/dev/null || true
