# o9nn Monorepo - Core CI/CD Pipeline
# Phase 1: Foundation & Consolidation

name: Core CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  FORCE_COLOR: 1

jobs:
  # Detect which packages changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
      core: ${{ steps.filter.outputs.core }}
      ml: ${{ steps.filter.outputs.ml }}
      llm: ${{ steps.filter.outputs.llm }}
      agents: ${{ steps.filter.outputs.agents }}
      gnn: ${{ steps.filter.outputs.gnn }}
      esn: ${{ steps.filter.outputs.esn }}
      sdk: ${{ steps.filter.outputs.sdk }}
      cli: ${{ steps.filter.outputs.cli }}
      apps: ${{ steps.filter.outputs.apps }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'packages/core/**'
            ml:
              - 'packages/ml/**'
            llm:
              - 'packages/llm/**'
            agents:
              - 'packages/agents/**'
            gnn:
              - 'packages/gnn/**'
            esn:
              - 'packages/esn/**'
            sdk:
              - 'packages/sdk/**'
            cli:
              - 'packages/cli/**'
            apps:
              - 'apps/**'
            infra:
              - 'infra/**'

  # Lint check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python tools
        run: |
          pip install ruff mypy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run Turbo lint
        run: pnpm turbo lint

      - name: Run Ruff (Python)
        run: ruff check packages/ --output-format=github
        continue-on-error: true

      - name: Run Ruff format check
        run: ruff format packages/ --check
        continue-on-error: true

  # TypeScript type checking
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run typecheck
        run: pnpm turbo typecheck

  # Build packages
  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build with Turbo
        run: pnpm turbo build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            packages/*/dist
            apps/*/dist
            packages/*/.next
          retention-days: 7

  # Unit tests
  test-unit:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        node-version: ["20", "22"]
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pip install pytest pytest-cov

      - name: Run unit tests
        run: pnpm turbo test:unit

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20' && matrix.python-version == '3.11'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info,coverage.xml
          fail_ci_if_error: false

  # Integration tests
  test-integration:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run integration tests
        run: pnpm turbo test:integration
        env:
          CI: true

  # Go tests
  test-go:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.sdk == 'true' || needs.changes.outputs.apps == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go mod download
        run: go work sync

      - name: Run Go tests
        run: |
          go test -race -coverprofile=coverage.out ./packages/...
          go test -race -coverprofile=coverage.out ./apps/...

      - name: Upload Go coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out

  # Final status check
  ci-status:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, test-unit]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.lint.result }}" == "failure" ] || \
             [ "${{ needs.typecheck.result }}" == "failure" ] || \
             [ "${{ needs.build.result }}" == "failure" ] || \
             [ "${{ needs.test-unit.result }}" == "failure" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed successfully"
